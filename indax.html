<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>测试页面 · 敬请期待</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 优雅的渐变背景，柔和科技感 */
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e8fc 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 装饰性的背景光晕/圆圈，增加层次感 */
        .bg-ornament {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-ornament::before,
        .bg-ornament::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.08);
            filter: blur(60px);
            animation: floatGlow 18s infinite alternate ease-in-out;
        }

        .bg-ornament::before {
            width: 60vw;
            height: 60vw;
            top: -20vh;
            left: -15vw;
            background: radial-gradient(circle, rgba(37,99,235,0.1), transparent);
        }

        .bg-ornament::after {
            width: 70vw;
            height: 70vw;
            bottom: -30vh;
            right: -20vw;
            background: radial-gradient(circle, rgba(139,92,246,0.1), transparent);
            animation-delay: -5s;
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.4;
            }
            100% {
                transform: translate(5%, 5%) scale(1.1);
                opacity: 0.7;
            }
        }

        /* 主卡片容器：完全居中 */
        .hero-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 90%;
            width: 700px;
            padding: 2rem;
            animation: fadeSlideUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        /* 优雅的磨砂玻璃卡片效果 */
        .message-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 64px;
            padding: 3rem 2rem;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transition: all 0.3s ease;
        }

        /* 主视觉装饰图标 */
        .icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #ffffff, #f1f5fe);
            width: 88px;
            height: 88px;
            border-radius: 48px;
            margin-bottom: 1.6rem;
            box-shadow: 0 15px 25px -10px rgba(0, 0, 0, 0.1);
        }

        .icon-badge span {
            font-size: 3.5rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        /* 核心文案 */
        .main-title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(145deg, #0f2b3d, #1e3a5f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
            text-shadow: 0 2px 4px rgba(255,255,255,0.5);
        }

        .sub-text {
            font-size: 1.25rem;
            color: #2c3e66;
            font-weight: 500;
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
        }

        .divider {
            width: 70px;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            border-radius: 4px;
            margin: 1.5rem auto;
        }

        .description {
            font-size: 0.95rem;
            color: #4a5b7a;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.5;
            background: rgba(255,255,240,0.4);
            padding: 0.5rem 1rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
        }

        /* 动态加载指示器（小圆点）增加期待感 */
        .progress-ring {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 2rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #3b82f6;
            border-radius: 50%;
            opacity: 0.4;
            animation: pulseDot 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; background-color: #6366f1; }
        .dot:nth-child(3) { animation-delay: 0.4s; background-color: #8b5cf6; }

        @keyframes pulseDot {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* 页脚小彩蛋 */
        .footer-tip {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #6c7e9e;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }

        /* 响应式调整 */
        @media (max-width: 550px) {
            .message-card {
                padding: 2rem 1.2rem;
                border-radius: 48px;
            }
            .main-title {
                font-size: 2.2rem;
            }
            .sub-text {
                font-size: 1rem;
            }
            .icon-badge {
                width: 70px;
                height: 70px;
            }
            .icon-badge span {
                font-size: 2.8rem;
            }
            .description {
                font-size: 0.8rem;
            }
        }

        /* 优雅进入动画 */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 可选: 悬停卡片微交互 */
        .message-card:hover {
            transform: scale(1.01);
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 35px 55px -18px rgba(0, 0, 0, 0.25);
            transition: all 0.35s ease;
        }
    </style>
</head>
<body>
    <!-- 背景装饰层，增加视觉效果但不影响居中 -->
    <div class="bg-ornament"></div>

    <!-- 核心居中内容区 -->
    <div class="hero-container">
        <div class="message-card">
            <!-- 图标区域，传达“建设中/期待”含义 -->
            <div class="icon-badge">
                <span>✨</span>
            </div>
            
            <!-- 主标题：测试页面 -->
            <h1 class="main-title">测试页面</h1>
            <!-- 副标题：敬请期待 醒目处理 -->
            <div class="sub-text">敬请期待</div>
            
            <!-- 装饰分割线 -->
            <div class="divider"></div>
            
            <!-- 温馨说明文案，增加专业感 -->
            <div class="description">
                正在精心筹备，即将呈现精彩内容
            </div>
            
            <!-- 动态呼吸点，增加“即将到来”的韵律 -->
            <div class="progress-ring">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        
        <!-- 页脚小提示，友好且不干扰居中 -->
        <div class="footer-tip">
            🧪 内部测试环境 · 感谢关注
        </div>
    </div>

    <!-- 极简交互：控制台输出状态，无额外干扰（可选，符合要求）-->
    <script>
        // 安静优雅的控制台问候，不干扰视觉设计
        console.log("%c✨ 测试页面 | 敬请期待 ✨", "color: #3b82f6; font-size: 14px; font-weight: bold;");
        console.log("%c页面已居中展示，所有元素均为flex垂直水平居中。", "color: #5b6e8c; font-size: 12px;");
        
        // 可选：添加一个非常细微的视差或鼠标跟随光晕效果（提升现代感但完全不影响居中要求）
        // 为了完全符合“测试页面，敬请期待”居中，此处仅增加极轻微背景光晕跟随效果，增强现代感但不改变布局
        document.addEventListener('mousemove', function(e) {
            // 这是一个非常轻微的装饰效果: 移动背景光晕? 由于背景已经足够美观，但为了增加趣味且不改变居中布局，
            // 只轻微改变伪元素光影方向（可选，完全不会影响文字或卡片位置）
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            const ornament = document.querySelector('.bg-ornament');
            if (ornament) {
                // 极其微妙的移动，不改变任何居中定位，仅增强视觉动态
                ornament.style.transform = `translate(${x * 4}px, ${y * 4}px)`;
                ornament.style.transition = 'transform 0.2s ease-out';
            }
        });
        // 确保移动端不会过度占用性能，并且不影响布局中心点
    </script>
</body>
</html>
